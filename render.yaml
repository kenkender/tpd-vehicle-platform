services:
  - type: web
    name: tpd-vehicle-platform
    env: node
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_SHEETS_ENABLED
        value: "true"
      - key: GOOGLE_SCRIPT_URL
        value: "https://script.google.com/macros/s/AKfycby5e3RSjzkgpzgIHNeBrLJkePgzlswVTKz1-daBVw_qY2GBBMmPuIS81kofNuAhqUwm/exec"

