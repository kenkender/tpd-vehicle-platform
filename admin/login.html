<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>เข้าสู่ระบบผู้ดูแล | ระบบทะเบียนยานพาหนะ ตท.</title>
  <meta name="description" content="หน้าเข้าสู่ระบบสำหรับผู้ดูแลระบบทะเบียนยานพาหนะ กองบัญชาการตำรวจท่องเที่ยว">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body class="login-body">
  <main class="login-wrap">
    <section class="card login-card" aria-labelledby="loginTitle">
      <img class="login-logo" src="/favicon.svg" alt="" width="64" height="64">
      <h1 id="loginTitle">ผู้ดูแลระบบ</h1>
      <p class="login-sub">ระบบทะเบียนยานพาหนะ · กองบัญชาการตำรวจท่องเที่ยว</p>
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="username">ชื่อผู้ใช้</label>
          <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" required autofocus>
        </div>
        <div class="field">
          <label for="password">รหัสผ่าน</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <div id="loginError" class="alert err hidden" role="alert"></div>
        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">เข้าสู่ระบบ</button>
      </form>
      <a class="login-back" href="/">← กลับหน้าลงทะเบียนสาธารณะ</a>
    </section>
  </main>
  <script src="/admin/assets/login.js"></script>
</body>
</html>
